<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة كيمياء التحصيلي</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 650px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #1a1a1a;
      font-weight: 700;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #e1e5ee;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #0d9488;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background-color: #0d9488;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #0f766e;
    }
    .user-header {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: white;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .user-info h3 {
      font-size: 22px;
      margin-bottom: 4px;
    }
    .user-info p {
      opacity: 0.9;
      font-size: 14px;
    }
    .btn-logout {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-logout:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }
    .item-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-decoration: none;
      color: #333;
      border: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: bold;
      font-size: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .item-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.05);
      border-color: #10b981;
    }
    .footer {
      text-align: center;
      margin-top: 30px;
      color: #888;
      font-size: 13px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="card">
      <h2>تسجيل دخول الطالب 🎓</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>الرقم الأكاديمي / الهوية</label>
          <input type="text" id="studentId" required placeholder="أدخل الرقم الأكاديمي">
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="studentPass" required placeholder="أدخل كلمة المرور">
        </div>
        <button type="submit" class="btn" id="submitBtn">دخول</button>
      </form>
    </div>

    <!-- شاشة البوابة والروابط -->
    <div id="portalSection" class="hidden">
      <div class="user-header">
        <div class="user-info">
          <h3>أهلاً بك، <span id="displayStudentName">طالب</span> 👋</h3>
          <p>مرحباً بك في بوابة اختبارات التحصيلي والكيمياء</p>
        </div>
        <button class="btn-logout" onclick="logout()">خروج</button>
      </div>

      <div class="grid">
        <a href="https://thsyly4.github.io/thsyly/" target="_blank" class="item-card">
          <span>🧪 كيمياء 1</span>
          <span>✨</span>
        </a>
        <a href="https://thsyly4.github.io/thsyly/" target="_blank" class="item-card">
          <span>⚗️ كيمياء 2</span>
          <span>✨</span>
        </a>
        <a href="https://thsyly4.github.io/thsyly/" target="_blank" class="item-card">
          <span>🔬 كيمياء 3</span>
          <span>✨</span>
        </a>
        <a href="https://thsyly4.github.io/thsyly/" target="_blank" class="item-card">
          <span>📚 تحصيلي كيمياء</span>
          <span>✨</span>
        </a>
        <a href="https://e3bd.github.io/404/" target="_blank" class="item-card">
          <span>⚡ اختبار تحصيلي - فيزياء أ. إبراهيم الاسمري</span>
          <span>✨</span>
        </a>
      </div>
    </div>

    <div class="footer">
      © جميع الحقوق محفوظة 2026<br>
      ثانوية الأمير عبدالمجيد بن عبدالعزيز | أ. عبدالرحمن العنزي
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwwjo2NhM2NC_dBgEefBg1D6mCPvSOQ_Eq3zOvWdmwxrf4kMexpX09wfabv-d_ofUhAbw/exec";

    // التحقق من وجود جلسة سابقة
    window.onload = function() {
      const savedName = localStorage.getItem("studentName");
      if (savedName) {
        showPortal(savedName);
      }
    };

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const id = document.getElementById("studentId").value.trim();
      const pass = document.getElementById("studentPass").value.trim();
      const submitBtn = document.getElementById("submitBtn");

      submitBtn.disabled = true;
      submitBtn.innerText = "جاري التحقق...";

      const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
      
      window[callbackName] = function(data) {
        delete window[callbackName];
        document.body.removeChild(script);
        submitBtn.disabled = false;
        submitBtn.innerText = "دخول";

        if (data.success) {
          localStorage.setItem("studentName", data.name);
          showPortal(data.name);
        } else {
          alert(data.message || "بيانات الدخول غير صحيحة");
        }
      };

      const script = document.createElement('script');
      script.src = `${SCRIPT_URL}?id=${encodeURIComponent(id)}&pass=${encodeURIComponent(pass)}&callback=${callbackName}`;
      
      script.onerror = function() {
        delete window[callbackName];
        document.body.removeChild(script);
        submitBtn.disabled = false;
        submitBtn.innerText = "دخول";
        alert("حدث خطأ في الاتصال بالجدول. يرجى التأكد من الاتصال.");
      };

      document.body.appendChild(script);
    });

    function showPortal(name) {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("portalSection").classList.remove("hidden");
      document.getElementById("displayStudentName").innerText = name;
    }

    function logout() {
      localStorage.removeItem("studentName");
      document.getElementById("portalSection").classList.add("hidden");
      document.getElementById("loginSection").classList.remove("hidden");
      document.getElementById("studentId").value = "";
      document.getElementById("studentPass").value = "";
    }
  </script>
</body>
</html>
